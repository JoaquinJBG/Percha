<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Percha · S2 Gemini</title>
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <main>
      <h1>S2 · Gemini desde el navegador</h1>

      <section>
        <h2>1. Clave</h2>
        <label for="clave">Clave de Gemini (se guarda solo en este navegador)</label>
        <div class="fila">
          <input id="clave" type="password" autocomplete="off" spellcheck="false" placeholder="Pega aquí tu clave" />
          <button id="olvidar" type="button" class="secundario">Olvidar</button>
        </div>
        <p id="estado-clave" class="nota"></p>
        <label class="check"><input id="simulado" type="checkbox" /> Respuesta simulada (sin clave ni red)</label>
      </section>

      <section>
        <h2>2. Modelo</h2>
        <label for="modelo">Modelo</label>
        <input id="modelo" list="modelos" value="gemini-3.5-flash-lite" spellcheck="false" />
        <datalist id="modelos">
          <option value="gemini-3.5-flash-lite"></option>
          <option value="gemini-3.1-flash-lite"></option>
          <option value="gemini-3.8-flash"></option>
          <option value="gemini-3.6-flash"></option>
          <option value="gemini-3-flash-preview"></option>
          <option value="gemini-2.5-flash"></option>
          <option value="gemini-2.5-flash-lite"></option>
          <option value="gemini-flash-latest"></option>
          <option value="gemini-flash-lite-latest"></option>
        </datalist>
        <div class="fila">
          <label for="pensamiento">Razonamiento</label>
          <select id="pensamiento">
            <option value="por-defecto">por defecto</option>
            <option value="MINIMAL">mínimo</option>
            <option value="LOW">bajo</option>
          </select>
          <label for="lado">Lado máx.</label>
          <select id="lado">
            <option value="512">512 px</option>
            <option value="768" selected>768 px</option>
            <option value="1024">1024 px</option>
            <option value="0">original</option>
          </select>
        </div>
        <div class="fila">
          <label for="resolucion">Resolución IA</label>
          <select id="resolucion">
            <option value="por-defecto">por defecto</option>
            <option value="LOW">baja</option>
            <option value="MEDIUM">media</option>
            <option value="HIGH">alta</option>
          </select>
        </div>
        <div class="fila">
          <button id="listar" type="button" class="secundario">Ver modelos de mi clave</button>
          <button id="cors" type="button" class="secundario">Comprobar CORS</button>
          <button id="busqueda" type="button" class="secundario">Probar búsqueda</button>
        </div>
      </section>

      <section>
        <h2>3. Fotos</h2>
        <label for="fotos">1–3 fotos de prendas (una prenda por foto; hasta 10 para medir el límite)</label>
        <input id="fotos" type="file" accept="image/*" multiple />
        <div id="miniaturas" class="miniaturas"></div>
        <button id="etiquetar" type="button" disabled>Etiquetar</button>
      </section>

      <section>
        <h2>Resultado</h2>
        <p id="estado" class="nota">Elige fotos o marca «Respuesta simulada».</p>
        <dl id="metricas" class="metricas"></dl>
        <div id="validacion"></div>
        <pre id="json"></pre>
      </section>

      <section>
        <h2>Registro de pruebas</h2>
        <div class="tabla"><table id="registro"></table></div>
        <div class="fila">
          <button id="copiar" type="button" class="secundario">Copiar en Markdown</button>
          <button id="vaciar" type="button" class="secundario">Vaciar</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
